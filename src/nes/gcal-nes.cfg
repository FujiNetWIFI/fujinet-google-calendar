# gcal-nes.cfg -- FujiNet Google Calendar on the NES: an MMC3 image (mapper
# 4) for the FujiNet NES cartridge. 128K PRG in sixteen 8K banks, 16K
# CHR-RAM, 8K WRAM.
#
#   bank 0   OVL_NET     at $8000 (R6): the network and every parser it
#                        feeds (net index detail lines agenda) -- one bank,
#                        because split_lines() calls its parser back
#   bank 1   OVL_VIEWS   DAY and AGENDA, the panel, the alarm band
#   bank 2   OVL_GRID    WEEK and MONTH
#   bank 3   OVL_DETAIL  the event, the calendar picker, settings
#   bank 4   OVL_FORM    the compose form (compose.c form.c), its painter and
#                        the on-screen keyboard
#   bank 5   OVL_PICK    the form's date, time and colour pickers
#   bank 6   OVL_BOOT    splash, busy, errors, the START menu, help, about
#   bank 7   CODE2 at $A000 (R7, never switched): main.c and the rest of the
#                        portable core every bank calls, and the chrome
#   bank 8   ART         the pattern tables (copied to CHR-RAM at boot)
#   bank 9   ART2        the large mark's tiles
#   bank 10-13           unused
#   bank 14-15 $C000-$FFFF, fixed: start-up, the interrupts, fujinet-lib,
#                        the cc65 runtime, the trampolines (tramp.c), the
#                        screen and input layers, the claim ("FUJI" at
#                        $FFF0, which keeps the cartridge's mailbox alive)
#                        and the vectors
#
# RAM: zero page; $0200 and $0300 the two sprite pages (one shown, one being
# drawn); $0400-$07FF the C stack. The cart's WRAM at $6000 holds the data,
# the variables and the PPU queue.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;
}
MEMORY {
    ZP:     file = "", start = $0000, size = $0100, type = rw, define = yes;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    B0:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B1:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B2:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B3:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B4:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B5:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B6:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B7:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    B8:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B9:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PAD:    file = %O, start = $8000, size = $8000, fill = yes, fillval = $FF;
    FIXED:  file = %O, start = $C000, size = $3FF0, fill = yes, fillval = $FF, define = yes;
    CLAIM:  file = %O, start = $FFF0, size = $000A, fill = yes, fillval = $FF;
    VECS:   file = %O, start = $FFFA, size = $0006, fill = yes;
    OAMRAM0: file = "", start = $0200, size = $0100;
    OAMRAM1: file = "", start = $0300, size = $0100;
    SRAM:   file = "", start = $0400, size = __STACKSIZE__, define = yes;
    RAM:    file = "", start = $6000, size = $2000, define = yes;
}
SEGMENTS {
    ZEROPAGE:   load = ZP,      type = zp;
    HEADER:     load = HEADER,  type = ro;
    OVL_NET:    load = B0,      type = ro, define = yes, optional = yes;
    OVL_VIEWS:  load = B1,      type = ro, define = yes, optional = yes;
    OVL_GRID:   load = B2,      type = ro, define = yes, optional = yes;
    OVL_DETAIL: load = B3,      type = ro, define = yes, optional = yes;
    OVL_FORM:   load = B4,      type = ro, define = yes, optional = yes;
    OVL_PICK:   load = B5,      type = ro, define = yes, optional = yes;
    OVL_BOOT:   load = B6,      type = ro, define = yes, optional = yes;
    CODE2:      load = B7,      type = ro, define = yes, optional = yes;
    ART:        load = B8,      type = ro, define = yes, optional = yes;
    ART2:       load = B9,      type = ro, define = yes, optional = yes;
    STARTUP:    load = FIXED,   type = ro, define = yes;
    LOWCODE:    load = FIXED,   type = ro, optional = yes;
    ONCE:       load = FIXED,   type = ro, optional = yes;
    CODE:       load = FIXED,   type = ro, define = yes;
    RODATA:     load = FIXED,   type = ro, define = yes;
    DATA:       load = FIXED,   run = RAM, type = rw, define = yes;
    BSS:        load = RAM,     type = bss, define = yes;
    OAM0:       load = OAMRAM0, type = bss;
    OAM1:       load = OAMRAM1, type = bss;
    CLAIM:      load = CLAIM,   type = ro;
    VECTORS:    load = VECS,    type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
